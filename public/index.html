<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Archive Of Your Own</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Archive Of <span class="accent">Your</span> Own</h1>
    <button id="filterToggle" class="icon-btn" aria-label="Toggle filters" aria-expanded="false">Filters</button>
  </header>

  <div class="search-row">
    <input id="search" type="search" aria-label="Search fics by title, author or tags" placeholder="Search title, author, tags…" autocomplete="off" />
  </div>

  <section id="filterPanel" class="filter-panel" hidden>
    <div class="filter-group" role="group" aria-label="Status">
      <button data-status="to_read" class="chip" aria-pressed="false">To read</button>
      <button data-status="unfinished" class="chip" aria-pressed="false">Unfinished</button>
      <button data-status="read" class="chip" aria-pressed="false">Read</button>
      <button data-status="dropped" class="chip" aria-pressed="false">Dropped</button>
    </div>
    <div class="filter-group">
      <button id="favToggle" class="chip" aria-pressed="false">★ Favourites only</button>
    </div>
    <div class="filter-group">
      <select id="sortSelect" aria-label="Sort by">
        <option value="updated_at">Recently updated</option>
        <option value="published_at">Recently published</option>
        <option value="word_count">Word count</option>
        <option value="kudos">Kudos</option>
        <option value="title">Title</option>
      </select>
    </div>
  </section>

  <!-- Announces a result count instead of re-reading every card on each change. -->
  <p id="srStatus" class="sr-only" role="status" aria-live="polite"></p>

  <main id="list" class="list"></main>

  <p id="loading" class="status-msg" hidden>Loading…</p>
  <p id="empty" class="empty" hidden>No fics match these filters.</p>
  <p id="error" class="status-msg" hidden>Couldn’t load fics.<button id="retry" class="icon-btn">Retry</button></p>

  <button id="loadMore" class="load-more" hidden>Load more</button>

  <div id="detail" class="detail" hidden>
    <div class="detail-panel" role="dialog" aria-modal="true" aria-label="Fic details">
      <div class="detail-close-bar">
        <button id="detailClose" class="icon-btn detail-close" aria-label="Close">✕</button>
      </div>
      <div id="detailBody"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
